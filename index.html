<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Monse Nails Studio: manicura rusa, soft gel, polygel y pedicura en Carlos Canut de Bon 2879. Reserva tu hora en línea.">
<meta name="theme-color" content="#4B1E3F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-60 -84 120 118%27%3E%3Cpath d=%27M0,-62 C21,-40 24,6 0,26 C-24,6 -21,-40 0,-62Z%27 fill=%27%234B1E3F%27/%3E%3C/svg%3E">
<title>Monse Nails Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: salón íntimo — hero partido con la foto de María, carta de servicios como menú, panel con resumen arriba y detalle abajo */
:root{
  --ciruela:#4B1E3F; --malva:#A8738F; --rosa:#E9CFD9; --blush:#F7EDF1; --marfil:#FDFAF8;
  --bg:var(--marfil); --surface:#FFFFFF; --soft:var(--blush); --soft-2:var(--rosa);
  --ink:#3A1730; --ink-2:#6E4A62; --ink-3:#9A7A8D; --line:#EBDCE3;
  --accent:var(--ciruela); --accent-ink:#FDFAF8; --accent-2:var(--malva);
  --ok:#3F7A5A; --ok-bg:#E4F1E9; --warn:#9A5B12; --warn-bg:#FBEEDB; --bad:#A23B4C; --bad-bg:#F8E3E7;
  --shadow:0 18px 40px -24px rgba(75,30,63,.35);
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans:"Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E0F1A; --surface:#2A1624; --soft:#331C2D; --soft-2:#47273F;
  --ink:#F7EDF1; --ink-2:#D9BFCC; --ink-3:#A88A9B; --line:#47293F;
  --accent:#E9CFD9; --accent-ink:#2A1624; --accent-2:#C595AE;
  --ok:#8FD0AA; --ok-bg:#1F3529; --warn:#E9B776; --warn-bg:#3A2A15; --bad:#F09AAA; --bad-bg:#3D1C24;
  --shadow:0 18px 40px -24px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E0F1A; --surface:#2A1624; --soft:#331C2D; --soft-2:#47273F;
  --ink:#F7EDF1; --ink-2:#D9BFCC; --ink-3:#A88A9B; --line:#47293F;
  --accent:#E9CFD9; --accent-ink:#2A1624; --accent-2:#C595AE;
  --ok:#8FD0AA; --ok-bg:#1F3529; --warn:#E9B776; --warn-bg:#3A2A15; --bad:#F09AAA; --bad-bg:#3D1C24;
  --shadow:0 18px 40px -24px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent-2);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:12px 22px;border-radius:999px;font-weight:400;letter-spacing:.04em;cursor:pointer;text-decoration:none;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.gift{background:var(--accent);color:var(--accent-ink)}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--accent)}
.brand svg{width:38px;height:38px}
.brand b{font-weight:400;letter-spacing:.32em;font-size:18px;display:block;line-height:1}
.brand small{display:block;font-size:9.5px;letter-spacing:.42em;color:var(--accent-2);margin-top:4px}
.nav{display:flex;align-items:center;gap:22px;font-size:14px}
.nav a{text-decoration:none;color:var(--ink-2)}
.nav a:hover{color:var(--accent)}
.nav .hide-sm{display:inline}
@media (max-width:760px){.nav .hide-sm{display:none}}
.demo-bar{background:var(--soft);color:var(--ink-2);font-size:13px;text-align:center;padding-block:7px}

/* ---------- Hero ---------- */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-family:var(--display);font-size:clamp(44px,6.4vw,78px);color:var(--accent);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--accent-2)}
.hero .lead{font-size:18px;color:var(--ink-2);max-width:46ch;margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.gift{display:flex;gap:14px;align-items:center;margin-top:34px;padding:14px 18px;border:1px dashed var(--accent-2);border-radius:14px;max-width:440px;color:var(--ink-2);font-size:15px}
.gift svg{flex:none;width:34px;height:34px;color:var(--accent-2)}
.gift b{font-weight:500;color:var(--accent)}
.portrait{position:relative;justify-self:end;width:min(100%,430px)}
.portrait .arch{aspect-ratio:3/4;max-width:100%;border-radius:220px 220px 26px 26px;overflow:hidden;background:var(--rosa);box-shadow:var(--shadow)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.portrait .tag{position:absolute;left:-28px;bottom:34px;background:var(--surface);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.portrait .tag svg{width:30px;height:30px;color:var(--accent)}
.portrait .tag b{display:block;font-weight:400;color:var(--accent)}
.portrait .tag span{font-size:13px;color:var(--ink-3)}
@media (max-width:860px){
  .hero{padding-block:28px 20px}
  .hero .wrap{grid-template-columns:1fr;gap:34px}
  .portrait{justify-self:center;width:min(100%,360px)}
  .portrait .tag{left:12px}
}

/* ---------- Sections ---------- */
section.block{padding-block:72px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.sec-head h2{font-family:var(--display);font-size:clamp(34px,4.4vw,52px);color:var(--accent);margin-top:8px}
.sec-head p{color:var(--ink-2);max-width:44ch}

.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.svc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .2s,box-shadow .2s}
.svc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.svc .ph{aspect-ratio:4/3;max-width:100%;background:var(--soft);position:relative;overflow:hidden}
.svc .ph img,.svc .ph svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.svc:hover .ph img{transform:scale(1.04)}
.svc .ph .pill{position:absolute;top:12px;left:12px;background:rgba(253,250,248,.92);color:#4B1E3F}
.svc .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.svc h3{font-family:var(--display);font-size:28px;color:var(--accent)}
.svc .desc{color:var(--ink-2);font-size:15px;flex:1}
.svc .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.svc .price{font-size:22px;font-weight:400;color:var(--accent)}
.svc .price small{font-size:12px;color:var(--ink-3);margin-left:6px;letter-spacing:.06em}
.svc .go{font-size:14px;color:var(--accent-2);letter-spacing:.06em}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.step{padding-top:20px;border-top:1px solid var(--accent-2)}
.step h3{font-size:20px;color:var(--accent);margin:10px 0 6px;font-weight:400}
.step p{color:var(--ink-2);font-size:15px}
.step .n{font-family:var(--display);font-size:30px;color:var(--accent-2)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

.band{background:var(--accent);color:var(--accent-ink)}
.band .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding-block:64px}
.band h2{font-family:var(--display);font-size:clamp(34px,4.4vw,54px)}
.band p{opacity:.85;margin-top:14px;max-width:44ch}
.band .eyebrow{color:inherit;opacity:.7}
.stamps{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stamp{width:62px;height:62px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.9}
.stamp svg{width:30px;height:30px}
.stamp.free{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
@media (max-width:760px){.band .wrap{grid-template-columns:1fr}}

.visit{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.visit .card{background:var(--soft);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px}
.visit dt{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2)}
.visit dd{margin:2px 0 14px;font-size:18px;color:var(--ink)}
.visit .hours{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-size:15px;color:var(--ink-2)}
@media (max-width:760px){.visit{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding-block:30px;color:var(--ink-3);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink-2)}

/* ---------- Booking drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,15,26,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:22px;animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.svc,.btn{transition:none}}
.dr-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.dr-head h2{font-family:var(--display);font-size:34px;color:var(--accent)}
.x{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;cursor:pointer;flex:none;font-size:20px;line-height:1}
.dr-svc{display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--soft)}
.dr-svc .mini{width:74px;height:56px;border-radius:10px;overflow:hidden;flex:none}
.dr-svc .mini svg,.dr-svc .mini img{width:100%;height:100%;object-fit:cover;display:block}
.dr-svc b{font-weight:400;color:var(--accent);display:block}
.dr-svc span{font-size:14px;color:var(--ink-2)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;background:var(--soft)}
.lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2);margin-bottom:10px;display:block}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:none;width:64px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;cursor:pointer;text-align:center;line-height:1.25}
.day small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.day b{display:block;font-size:22px;font-weight:400}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.slot small{display:block;font-size:12px;color:var(--ink-3)}
.slot:disabled{cursor:not-allowed;background:var(--soft);color:var(--ink-3);text-decoration:line-through}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--soft)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-2) 25%,transparent)}
.field .err{font-size:12px;color:var(--bad);min-height:0}
@media (max-width:460px){.form{grid-template-columns:1fr}}
.loyal-note{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--ink-2)}
.loyal-note.free{background:var(--accent);color:var(--accent-ink)}
.done{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.done .check{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.msgbox{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink-2);white-space:pre-wrap;user-select:all}
.hint{font-size:13px;color:var(--ink-3)}

/* ---------- Panel ---------- */
.panel{padding-block:30px 60px}
.p-head{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.p-head h1{font-family:var(--display);font-size:clamp(34px,4.5vw,48px);color:var(--accent)}
.p-head p{color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.kpi small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{display:block;font-weight:400;font-size:30px;color:var(--accent);margin-top:4px;line-height:1.15}
.kpi span{font-size:13px;color:var(--ink-2)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.card h3{font-size:18px;font-weight:400;color:var(--accent);margin-bottom:4px}
.card .sub{font-size:13px;color:var(--ink-3);margin-bottom:18px}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.bar-row .t{display:flex;gap:8px;align-items:center;min-width:0}
.bar-row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{grid-column:1/-1;height:10px;border-radius:6px;background:var(--soft)}
.bar-fill{height:100%;border-radius:6px;background:var(--accent-2)}
.bar-fill.best{background:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo div{border-radius:14px;padding:14px 16px;background:var(--soft)}
.duo small{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.duo b{display:block;font-weight:400;color:var(--accent);margin-top:4px}
.duo span{font-size:13px;color:var(--ink-2)}
.months{display:flex;align-items:end;gap:14px;height:150px;padding-top:10px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--ink-3)}
.mcol .v{color:var(--ink-2)}
.mcol .b{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--soft-2)}
.mcol.now .b{background:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.who b{font-weight:400;display:block}
.who span{font-size:13px;color:var(--ink-3)}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--accent-2)}
.dot.on{background:var(--accent-2)}
.dots{flex:none}
.dot.six{width:20px;height:20px;display:grid;place-items:center;font-size:10.5px;line-height:1;border-color:var(--accent);color:var(--accent)}
.dot.six.ready{background:var(--accent);color:var(--accent-ink)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.svc-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.sa{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sa.off{opacity:.6}
.sa .ph{aspect-ratio:16/9;max-width:100%}
.sa .ph svg,.sa .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sa .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.sa .body h4{margin:0;font-weight:400;font-size:17px;color:var(--accent)}
.sa .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.sa .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.price-in{width:110px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
/* ---------- celular ---------- */
.nowrap{white-space:nowrap}
.file-btn{position:relative}
.svc-layout{grid-template-columns:1fr minmax(0,340px);align-items:start}
.dr-foot{position:sticky;bottom:0;margin:16px -24px 0;padding:12px 24px max(14px, env(safe-area-inset-bottom, 0px));background:linear-gradient(to bottom, transparent, var(--bg) 18px)}
.fab{display:none}
@media (max-width:760px){

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.113.0/dist/umd/supabase.js"></script>
<script src="config.js" onerror="void 0"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN — las llaves de Supabase NO van en este archivo.
   Viven en .env (fuera de GitHub) y `node build.mjs` genera config.js
   con ellas al publicar. Sin config.js la web funciona en MODO DEMO.
   ===================================================================== */
const CONFIG = window.MONSE_CONFIG || { SUPABASE_URL: "", SUPABASE_KEY: "" };
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY;

const STUDIO = {
  nombre: "Monse Nails Studio",
  duena: "María Gabriela",
  direccion: "Carlos Canut de Bon 2879",
  telefono: "+56 9 2610 8745",
  whatsapp: "56926108745",
  avisosAutomaticos: false,          // true cuando la Edge Function "notificar-reserva" esté activa (ver README)
  bloques: [10, 12, 14, 16, 18],   // inicio de cada bloque de 2 horas
  duracionBloque: 2,
  diasAbiertos: [1, 2, 3, 4, 5, 6], // lunes a sábado
  fidelidad: 6                       // el 6.º servicio es gratis
};

const SEED_SERVICES = [
  { id: "s1", nombre: "Manicura rusa", descripcion: "Limpieza profunda de cutícula con torno, sin esmalte. Uñas prolijas y naturales.", precio: 5000, estilo: "rusa", imagen: "fotos/rusa-1.jpg", galeria: ["fotos/rusa-1.jpg", "fotos/rusa-2.jpg", "fotos/rusa-3.jpg"], activo: true },
  { id: "s2", nombre: "Manicura rusa + nivelación + color", descripcion: "Manicura rusa, nivelación con base rubber y esmaltado semipermanente en el tono que elijas.", precio: 15000, estilo: "color", imagen: "fotos/polygel-3.jpg", galeria: ["fotos/polygel-3.jpg", "fotos/polygel-2.jpg"], activo: true },
  { id: "s3", nombre: "Soft gel", descripcion: "Extensión con tips de soft gel: largo y forma a tu gusto, livianas y resistentes.", precio: 15000, estilo: "softgel", imagen: "fotos/softgel-1.jpg", galeria: ["fotos/softgel-1.jpg", "fotos/softgel-2.jpg", "fotos/softgel-3.jpg"], activo: true },
  { id: "s4", nombre: "Polygel", descripcion: "Construcción con polygel para uñas firmes y de forma perfecta. Ideal para francesa o diseño.", precio: 18000, estilo: "polygel", imagen: "fotos/polygel-1.jpg", galeria: ["fotos/polygel-1.jpg", "fotos/polygel-2.jpg", "fotos/polygel-3.jpg"], activo: true },
  { id: "s5", nombre: "Pedicura + semipermanente", descripcion: "Pedicura completa con limpieza, limado y esmaltado semipermanente de larga duración.", precio: 10000, estilo: "pedi", imagen: "fotos/pedi-2.jpg", galeria: ["fotos/pedi-2.jpg", "fotos/pedi-3.jpg", "fotos/pedi-1.jpg"], activo: true }
];

const STORE_KEY = "monse-demo-v2";
let state = null;

function seedState() {
  // Datos de ejemplo: 12 clientas y ~3 meses de historial generado de forma fija.
  const names = [["Camila","Rojas"],["Valentina","Muñoz"],["Javiera","Soto"],["Fernanda","Contreras"],["Catalina","Silva"],["Antonia","Martínez"],["Constanza","Pérez"],["Daniela","González"],["Isidora","Morales"],["Francisca","Vargas"],["Josefa","Reyes"],["Martina","Castro"]];
  const clientes = names.map(([n, a], i) => ({
    id: "c" + (i + 1), nombre: n, apellido: a,
    correo: (n + "." + a).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + "@gmail.com",
    telefono: "+56 9 " + String(5000 + i * 731).slice(0, 4) + " " + String(1200 + i * 457).slice(0, 4)
  }));
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const weights = [3, 1, 6, 9, 4, 2, 2, 1, 5, 3, 2, 1]; // algunas clientas vienen mucho más
  const svcW = { s1: 2, s2: 5, s3: 4, s4: 3, s5: 3 };
  const pick = (obj) => { const t = Object.values(obj).reduce((a, b) => a + b, 0); let r = rnd() * t; for (const k in obj) { r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; };
  const clientW = Object.fromEntries(clientes.map((c, i) => [c.id, weights[i]]));
  const reservas = [];
  const today = startOfDay(new Date());
  let id = 1;
  for (let d = -92; d <= 12; d++) {
    const day = addDays(today, d);
    if (!STUDIO.diasAbiertos.includes(day.getDay())) continue;
    const n = d < 0 ? Math.floor(rnd() * 3.2) : Math.floor(rnd() * 2.4);
    const used = new Set();
    for (let k = 0; k < n; k++) {
      let h = STUDIO.bloques[Math.floor(rnd() * STUDIO.bloques.length)];
      if (used.has(h)) continue; used.add(h);
      const sid = pick(svcW);
      reservas.push({
        id: "r" + id++, servicioId: sid, clientaId: pick(clientW), fecha: ymd(day), hora: h,
        estado: d < 0 ? (rnd() < .06 ? "cancelada" : "completada") : "confirmada",
        precio: SEED_SERVICES.find(s => s.id === sid).precio, gratis: false, creada: ymd(addDays(day, -3))
      });
    }
  }
  // aplica la regla de fidelidad en orden cronológico
  const count = {};
  reservas.sort(byDate).forEach(r => {
    if (r.estado === "cancelada") return;
    count[r.clientaId] = (count[r.clientaId] || 0) + 1;
    if (count[r.clientaId] % STUDIO.fidelidad === 0) r.gratis = true;
  });
  return { servicios: structuredClone(SEED_SERVICES), clientas: clientes, reservas };
}

function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { state = JSON.parse(raw); return; } } catch (e) {}
  state = seedState();
}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

const mockDb = {
  // → supabase.from('servicios').select('*').order('orden')
  async listarServicios({ soloActivos = false } = {}) { return state.servicios.filter(s => !soloActivos || s.activo); },
  // → supabase.from('servicios').insert(data)
  async crearServicio(data) { const s = { id: "s" + Date.now(), activo: true, imagen: "", galeria: [], ...data }; state.servicios.push(s); persist(); return s; },
  // → supabase.from('servicios').update(cambios).eq('id', id)
  async actualizarServicio(id, cambios) { Object.assign(state.servicios.find(s => s.id === id), cambios); persist(); },
  // → supabase.from('servicios').delete().eq('id', id)  (solo si no tiene reservas)
  async eliminarServicio(id) { state.servicios = state.servicios.filter(s => s.id !== id); persist(); },
  // → supabase.from('reservas').select('fecha, hora_inicio').neq('estado','cancelada').gte('fecha', desde)
  async bloquesOcupados(fecha) { return state.reservas.filter(r => r.fecha === fecha && r.estado !== "cancelada").map(r => r.hora); },
  // → supabase.from('clientas').upsert(...) + supabase.from('reservas').insert(...)
  async crearReserva({ servicioId, fecha, hora, clienta }) {
    let c = state.clientas.find(x => x.correo.toLowerCase() === clienta.correo.toLowerCase() || normPhone(x.telefono) === normPhone(clienta.telefono));
    if (!c) { c = { id: "c" + Date.now(), ...clienta }; state.clientas.push(c); }
    const visitas = state.reservas.filter(r => r.clientaId === c.id && r.estado !== "cancelada").length;
    const svc = state.servicios.find(s => s.id === servicioId);
    const r = { id: "r" + Date.now(), servicioId, clientaId: c.id, fecha, hora, estado: "confirmada", precio: svc.precio, gratis: (visitas + 1) % STUDIO.fidelidad === 0, creada: ymd(new Date()) };
    state.reservas.push(r); persist(); return { reserva: r, clienta: c, visitas: visitas + 1 };
  },
  // → consulta por correo/teléfono para mostrar el avance de fidelidad antes de reservar
  async visitasDe(correo, telefono) {
    const c = state.clientas.find(x => (correo && x.correo.toLowerCase() === correo.toLowerCase()) || (telefono && normPhone(x.telefono) === normPhone(telefono)));
    return c ? state.reservas.filter(r => r.clientaId === c.id && r.estado !== "cancelada").length : 0;
  },
  async listarReservas() { return state.reservas.slice().sort(byDate); },
  async listarClientas() { return state.clientas.slice(); },
  async cambiarEstado(id, estado) { state.reservas.find(r => r.id === id).estado = estado; persist(); },
  async moverReserva(id, fecha, hora) {
    if (state.reservas.some(r => r.id !== id && r.fecha === fecha && r.hora === hora && r.estado !== "cancelada")) throw new Error("Ese bloque ya está ocupado.");
    Object.assign(state.reservas.find(r => r.id === id), { fecha, hora }); persist();
  },
  async acceso() { return { email: "maria@demo", admin: true }; },
  async reiniciarDemo() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} state = seedState(); },
  async subirFoto(file) { return new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = bad; fr.readAsDataURL(file); }); },
  async sesion() { return true; }, async entrar() {}, async salir() {}
};

/* ---------- Supabase (ver supabase/schema.sql) ---------- */
const sb = DEMO ? null : window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const must = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
const fromSvc = r => ({ id: r.id, nombre: r.nombre, descripcion: r.descripcion || "", precio: r.precio, estilo: r.estilo || "color", imagen: r.imagen || "", galeria: r.galeria || [], activo: r.activo });
const fromRes = r => ({ id: r.id, servicioId: r.servicio_id, clientaId: r.clienta_id, fecha: r.fecha, hora: r.hora, estado: r.estado, precio: r.precio, gratis: r.gratis, creada: (r.creada_en || "").slice(0, 10) });
const supaDb = {
  async listarServicios({ soloActivos = false } = {}) {
    let q = sb.from("servicios").select("*").order("orden").order("creado_en");
    if (soloActivos) q = q.eq("activo", true);
    return must(await q).map(fromSvc);
  },
  async crearServicio(d) {
    const row = { nombre: d.nombre, descripcion: d.descripcion, precio: d.precio, estilo: d.estilo, imagen: d.imagen || null, galeria: d.imagen ? [d.imagen] : [] };
    return fromSvc(must(await sb.from("servicios").insert(row).select().single()));
  },
  async actualizarServicio(id, cambios) { must(await sb.from("servicios").update(cambios).eq("id", id)); },
  async eliminarServicio(id) { must(await sb.from("servicios").delete().eq("id", id)); },
  async bloquesOcupados(fecha) { return must(await sb.rpc("bloques_ocupados", { p_fecha: fecha })).map(Number); },
  async crearReserva({ servicioId, fecha, hora, clienta }) {
    const r = must(await sb.rpc("crear_reserva", { p_servicio: servicioId, p_fecha: fecha, p_hora: hora, p_nombre: clienta.nombre, p_apellido: clienta.apellido, p_correo: clienta.correo, p_telefono: clienta.telefono }));
    return { reserva: { id: r.id, servicioId, fecha, hora, estado: r.estado, precio: r.precio, gratis: r.gratis }, clienta, visitas: r.visitas };
  },
  async visitasDe(correo, telefono) { return must(await sb.rpc("visitas_de", { p_correo: correo || "", p_telefono: telefono || "" })); },
  async listarReservas() { return must(await sb.from("reservas").select("*").order("fecha").order("hora")).map(fromRes); },
  async listarClientas() { return must(await sb.from("clientas").select("id, nombre, apellido, correo, telefono")); },
  async cambiarEstado(id, estado) { must(await sb.from("reservas").update({ estado }).eq("id", id)); },
  async moverReserva(id, fecha, hora) {
    const { error } = await sb.from("reservas").update({ fecha, hora }).eq("id", id);
    if (error) throw new Error(error.code === "23505" ? "Ese bloque ya está ocupado." : error.message);
  },
  // Quién entró y si su correo está en la tabla admins (null = falta la migración 002)
  async acceso() {
    const { data } = await sb.auth.getUser();
    const { data: admin, error } = await sb.rpc("soy_admin");
    return { email: data.user?.email || "", admin: error ? null : !!admin };
  },
  async subirFoto(file) {
    const path = Date.now() + "-" + file.name.toLowerCase().replace(/[^a-z0-9.]+/g, "-");
    must(await sb.storage.from("fotos").upload(path, file, { contentType: file.type }));
    return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
  },
  async sesion() { const { data } = await sb.auth.getSession(); return !!data.session; },
  async entrar(email, password) { must(await sb.auth.signInWithPassword({ email, password })); },
  async salir() { await sb.auth.signOut(); },
  async reiniciarDemo() {}
};
const db = DEMO ? mockDb : supaDb;

/* ---------- utilidades ---------- */
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function byDate(a, b) { return a.fecha === b.fecha ? a.hora - b.hora : a.fecha < b.fecha ? -1 : 1; }
function normPhone(p) { return String(p || "").replace(/\D/g, "").slice(-8); }
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fechaLarga = s => { const d = parseYmd(s); return ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const fechaCorta = s => { const d = parseYmd(s); return d.getDate() + " " + MESES[d.getMonth()].slice(0, 3); };
const bloque = h => String(h).padStart(2, "0") + ":00 – " + String(h + STUDIO.duracionBloque).padStart(2, "0") + ":00";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

const ART = {
  rusa:    { bg: ["#F7EDF1", "#E9CFD9"], nail: ["#F2D3C8", "#E6B9AA"], len: .82, tip: null, gloss: .55, shape: "almond", label: "Natural" },

  softgel: { bg: ["#F7EDF1", "#DCC0CE"], nail: ["#D7A3BC", "#A8738F"], len: 1.28, tip: null, gloss: .75, shape: "almond", label: "Extensión" },
  polygel: { bg: ["#FBF4F6", "#E9CFD9"], nail: ["#F4D9D2", "#EBC4BC"], len: 1.18, tip: "#FFFDFB", gloss: .65, shape: "almond", label: "Francesa" },
  pedi:    { bg: ["#F5E8EE", "#E3C6D2"], nail: ["#C9587E", "#9E3A62"], len: .62, tip: null, gloss: .7, shape: "square", label: "Pies" }
};
let artId = 0;
function nailArt(estilo) {
  const a = ART[estilo] || ART.color, id = "a" + (artId++);
  const isPedi = a.shape === "square";
  const fingers = isPedi
    ? [[-128, 26, 1.25, -6], [-52, 6, .95, -2], [10, 0, .85, 0], [64, 4, .75, 3], [110, 14, .62, 6]]
    : [[-120, 36, .86, -14], [-58, -4, 1, -6], [0, -16, 1.04, 0], [58, -6, .98, 6], [116, 26, .8, 14]];
  const nail = (x, y, s, rot) => {
    const L = 80 * a.len, W = 30;
    const path = isPedi
      ? `M${-W},${-L * .2} Q${-W},${-L} 0,${-L} Q${W},${-L} ${W},${-L * .2} L${W},${L * .45} Q0,${L * .62} ${-W},${L * .45}Z`
      : `M0,${-L} C${W * .9},${-L * .62} ${W * 1.05},${L * .1} ${W * .82},${L * .38} Q0,${L * .62} ${-W * .82},${L * .38} C${-W * 1.05},${L * .1} ${-W * .9},${-L * .62} 0,${-L}Z`;
    return `<g transform="translate(${200 + x},${190 + y}) rotate(${rot}) scale(${s})">
      <ellipse cx="0" cy="${L * .62}" rx="${W * 1.25}" ry="${L * .55}" fill="#F0D2C6" opacity=".95"/>
      <path d="${path}" fill="url(#${id}n)"/>
      ${a.tip ? `<path d="${path}" fill="${a.tip}" clip-path="url(#${id}t${isPedi ? "s" : ""})"/>` : ""}
      <path d="M${-W * .32},${-L * .55} Q${-W * .5},${-L * .05} ${-W * .38},${L * .25}" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity="${a.gloss}"/>
    </g>`;
  };
  const L = 80 * a.len;
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Referencia ${a.label.toLowerCase()}">
    <defs>
      <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.bg[0]}"/><stop offset="1" stop-color="${a.bg[1]}"/></linearGradient>
      <linearGradient id="${id}n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.nail[0]}"/><stop offset="1" stop-color="${a.nail[1]}"/></linearGradient>
      <clipPath id="${id}t"><rect x="-60" y="${-L - 10}" width="120" height="${L * .42 + 10}"/></clipPath>
    </defs>
    <rect width="400" height="300" fill="url(#${id}b)"/>
    <circle cx="318" cy="70" r="92" fill="#fff" opacity=".28"/>
    <circle cx="62" cy="262" r="70" fill="#4B1E3F" opacity=".05"/>
    ${fingers.map(f => nail(...f)).join("")}
    <g fill="#fff" opacity=".85"><circle cx="70" cy="64" r="2.4"/><circle cx="92" cy="48" r="1.4"/><circle cx="338" cy="232" r="2"/><circle cx="352" cy="214" r="1.2"/></g>
  </svg>`;
}
function media(s) { return s.imagen ? `<img src="${esc(s.imagen)}" alt="Foto de referencia: ${esc(s.nombre)}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(nailArt('${s.estilo}')))">` : nailArt(s.estilo); }

let bk = null;
async function openBooking(servicioId) {
  const servicios = await db.listarServicios({ soloActivos: true });
  if (!servicios.length) return toast("No hay servicios disponibles por ahora. Escríbele a María por WhatsApp.");
  bk = { servicioId: servicioId || servicios[0].id, fecha: null, hora: null, step: "form" };
  const days = []; let d = addDays(startOfDay(new Date()), 1);
  while (days.length < 14) { if (STUDIO.diasAbiertos.includes(d.getDay())) days.push(ymd(d)); d = addDays(d, 1); }
  bk.days = days; bk.fecha = days[0];
  await drawBooking();
}
function closeBooking() { layer.innerHTML = ""; bk = null; }

async function drawBooking() {

  const ocupados = await db.bloquesOcupados(bk.fecha);
  if (ocupados.includes(bk.hora)) bk.hora = null;
  const v = bk.vals || {};
  layer.innerHTML = `<div class="scrim" data-close><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="bk-title">
    <div class="dr-head"><div><span class="eyebrow">Reserva</span><h2 id="bk-title">Elige tu bloque</h2></div><button class="x" data-close aria-label="Cerrar">×</button></div>

      <span class="lbl">Tus datos</span>

  updateLoyal();

async function updateLoyal() {
  const el = document.getElementById("loyal"); if (!el) return;
  const correo = document.getElementById("f-correo").value.trim(), tel = document.getElementById("f-telefono").value.trim();
  if (!correo && normPhone(tel).length < 8) return;
  const n = await db.visitasDe(correo, normPhone(tel).length >= 8 ? tel : "");
  if (!n) { el.className = "loyal-note"; el.textContent = "Con cada reserva sumas un sello. El sexto servicio es gratis."; return; }
  const next = n + 1;
  if (next % STUDIO.fidelidad === 0) { el.className = "loyal-note free"; el.textContent = `¡Hola de nuevo! Llevas ${n} servicios: esta reserva es gratis.`; }
  else { el.className = "loyal-note"; el.textContent = `¡Hola de nuevo! Llevas ${n % STUDIO.fidelidad} de 5 sellos. Te faltan ${STUDIO.fidelidad - 1 - (n % STUDIO.fidelidad)} para tu servicio gratis.`; }
}

async function submitBooking(form) {
  const vals = Object.fromEntries(new FormData(form).entries());
  Object.keys(vals).forEach(k => vals[k] = vals[k].trim());
  const errs = {};
  if (!vals.nombre) errs.nombre = "Escribe tu nombre.";
  if (!vals.apellido) errs.apellido = "Escribe tu apellido.";
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(vals.correo)) errs.correo = "Revisa el correo, por ejemplo nombre@gmail.com.";
  if (normPhone(vals.telefono).length < 8) errs.telefono = "Escribe un teléfono de 9 dígitos, por ejemplo +56 9 1234 5678.";
  form.querySelectorAll("[data-err]").forEach(e => e.textContent = errs[e.dataset.err] || "");
  if (Object.keys(errs).length) return;
  const ocupados = await db.bloquesOcupados(bk.fecha);
  if (ocupados.includes(bk.hora)) { toast("Ese bloque se acaba de ocupar. Elige otro."); bk.vals = vals; return drawBooking(); }
  const btn = form.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Reservando…";
  try { bk.result = await db.crearReserva({ servicioId: bk.servicioId, fecha: bk.fecha, hora: bk.hora, clienta: vals }); }
  catch (err) { toast(err.message || "No se pudo reservar. Intenta de nuevo."); bk.vals = vals; return drawBooking(); }
  bk.step = "done"; drawBooking();
}

async function stats() {
  const [servicios, reservas, clientas] = await Promise.all([db.listarServicios(), db.listarReservas(), db.listarClientas()]);
  const done = reservas.filter(r => r.estado === "completada");
  const ingreso = r => r.gratis ? 0 : r.precio;
  const total = done.reduce((a, r) => a + ingreso(r), 0);
  const now = new Date(), mk = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const thisM = mk(now);
  const mes = done.filter(r => r.fecha.startsWith(thisM));
  const months = [3, 2, 1, 0].map(k => { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); const key = mk(d); return { key, label: MESES[d.getMonth()].slice(0, 3), v: done.filter(r => r.fecha.startsWith(key)).reduce((a, r) => a + ingreso(r), 0) }; });
  const porServicio = servicios.map(s => { const rs = done.filter(r => r.servicioId === s.id); return { s, n: rs.length, v: rs.reduce((a, r) => a + ingreso(r), 0) }; }).sort((a, b) => b.v - a.v);
  const hoy = ymd(now);
  const proximas = reservas.filter(r => r.estado === "confirmada" && r.fecha >= hoy);
  const perClient = clientas.map(c => {
    const rs = reservas.filter(r => r.clientaId === c.id && r.estado !== "cancelada");
    const comp = rs.filter(r => r.estado === "completada");
    return { c, visitas: rs.length, completadas: comp.length, gastado: comp.reduce((a, r) => a + ingreso(r), 0), gratis: rs.filter(r => r.gratis).length, ultima: comp.length ? comp[comp.length - 1].fecha : null };
  }).sort((a, b) => b.visitas - a.visitas);
  const gratisMes = mes.filter(r => r.gratis).length;
  return { servicios, reservas, clientas, done, total, mes, mesTotal: mes.reduce((a, r) => a + ingreso(r), 0), months, porServicio, proximas, perClient, gratisMes };
}

/* ---------- calendario semanal ---------- */
let semana = lunesDe(new Date()), diaMovil = null, ultimoSt = null, confirmCancel = null, escuchando = false;
function lunesDe(d) { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); }
const pad2 = n => String(n).padStart(2, "0");
const pillEstado = r => r.estado === "completada" ? `<span class="pill ok">Completada</span>` : r.estado === "cancelada" ? `<span class="pill bad">Cancelada</span>` : `<span class="pill warn">Confirmada</span>`;
const telWa = t => { const d = String(t || "").replace(/\D/g, ""); return d.length === 8 ? "569" + d : d.length === 9 && d[0] === "9" ? "56" + d : d; };

function calendario(st) {
  const hoy = ymd(new Date());
  const dias = STUDIO.diasAbiertos.map(n => ymd(addDays(semana, n - 1)));
  if (!dias.includes(diaMovil)) diaMovil = dias.includes(hoy) ? hoy : dias[0];
  const activas = st.reservas.filter(r => r.estado !== "cancelada" && dias.includes(r.fecha));
  const cli = id => st.clientas.find(c => c.id === id) || { nombre: "Clienta", apellido: "" };
  const svc = id => (st.servicios.find(s => s.id === id) || { nombre: "Servicio" }).nombre;
  const ini = parseYmd(dias[0]), fin = parseYmd(dias[dias.length - 1]);
  const rango = ini.getMonth() === fin.getMonth() ? `${ini.getDate()} – ${fin.getDate()} de ${MESES[fin.getMonth()]}` : `${ini.getDate()} ${MESES[ini.getMonth()].slice(0, 3)} – ${fin.getDate()} ${MESES[fin.getMonth()].slice(0, 3)}`;
  const pend = activas.filter(r => r.estado === "confirmada").length;
  const celda = (f, h, col) => {
    const r = activas.find(x => x.fecha === f && x.hora === h);
    if (r) {
      const c = cli(r.clientaId);
      return `<button class="cal-res est-${r.estado}" data-col="${col}" data-res="${r.id}" draggable="${r.estado === "confirmada" && f >= hoy}" aria-label="${esc(c.nombre)} ${esc(c.apellido)}, ${esc(svc(r.servicioId))}, ${bloque(h)}">
        <b>${esc(c.nombre)} ${esc(c.apellido)}</b><span>${esc(svc(r.servicioId))}</span><em>${r.gratis ? "Gratis" : r.estado === "completada" ? "Completada" : clp(r.precio)}</em></button>`;
    }
    const past = f < hoy;
    return `<div class="cal-cell ${past ? "past" : ""}" data-col="${col}" ${past ? "" : `data-drop="${f}|${h}"`}>${past ? "" : "Libre"}</div>`;
  };
  return `
  <div class="cal-bar">
    <div class="cal-nav"><button class="btn sm ghost" data-semana="-1" aria-label="Semana anterior">‹</button><h3 class="num">${rango}</h3><button class="btn sm ghost" data-semana="1" aria-label="Semana siguiente">›</button>${dias.includes(hoy) ? "" : `<button class="btn sm ghost" data-semana="0">Hoy</button>`}</div>
    <p class="hint">${pend ? `${pend} hora${pend > 1 ? "s" : ""} por atender esta semana.` : "No hay horas por atender esta semana."} Toca un bloque para ver el detalle<span class="hide-sm"> o arrástralo a otro día y hora</span>.</p>
  </div>
  <div class="cal-days">${dias.map(f => { const d = parseYmd(f), n = activas.filter(r => r.fecha === f).length; return `<button class="cal-day ${f === hoy ? "today" : ""}" data-dia="${f}" aria-pressed="${f === diaMovil}"><small>${DIAS[d.getDay()]}</small><b class="num">${d.getDate()}</b><i>${n || ""}</i></button>`; }).join("")}</div>
  <div class="cal" data-show="${dias.indexOf(diaMovil)}">
    <div class="cal-corner"></div>
    ${dias.map((f, i) => { const d = parseYmd(f); return `<div class="cal-head ${f === hoy ? "today" : ""}" data-col="${i}"><small>${DIAS[d.getDay()]}</small><b class="num">${d.getDate()}</b></div>`; }).join("")}
    ${STUDIO.bloques.map(h => `<div class="cal-hour num">${pad2(h)}:00<small>${pad2(h + STUDIO.duracionBloque)}:00</small></div>` + dias.map((f, i) => celda(f, h, i)).join("")).join("")}
  </div>
  <div class="cal-legend"><span><i class="lg est-confirmada"></i>Confirmada</span><span><i class="lg est-completada"></i>Completada</span><span><i class="lg libre"></i>Libre</span></div>`;
}

    </dl>
    <div class="det-acts">
      <a class="btn sm wa" href="https://wa.me/${telWa(c.telefono)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp a la clienta</a>
      ${editable && r.fecha <= hoy ? `<button class="btn sm" data-estado="completada" data-id="${r.id}">Marcar completada</button>` : ""}
    </div>
    ${editable ? `
    <form class="move" id="move-form" data-id="${r.id}" novalidate>
      <span class="lbl">Mover a otro día u hora</span>
      <div class="move-row">
        <input type="date" id="mv-fecha" value="${r.fecha}" min="${hoy}" aria-label="Nuevo día">
        <select id="mv-hora" aria-label="Nuevo bloque">${STUDIO.bloques.map(h => `<option value="${h}" ${h === r.hora ? "selected" : ""}>${bloque(h)}</option>`).join("")}</select>
        <button class="btn sm" type="submit">Mover</button>
      </div>
    </form>
    <div class="det-danger">${confirmCancel === r.id
      ? `<span>¿Cancelar la hora y liberar el bloque?</span><button class="btn sm danger" data-estado="cancelada" data-id="${r.id}">Sí, cancelar</button><button class="btn sm ghost" data-nocancel="${r.id}">No</button>`
      : `<button class="btn sm ghost" data-askcancel="${r.id}">Cancelar y liberar el bloque</button>`}</div>` : ""}
  </div></div>`;
}

async function moverReserva(id, fecha, hora) {
  if (!fecha) return toast("Elige un día.");
  if (!STUDIO.diasAbiertos.includes(parseYmd(fecha).getDay())) return toast("Ese día el studio está cerrado.");
  if (fecha < ymd(new Date())) return toast("No se puede mover a un día que ya pasó.");
  try { await db.moverReserva(id, fecha, hora); } catch (err) { return toast(err.message); }
  semana = lunesDe(parseYmd(fecha)); diaMovil = fecha;
  const st = await renderPanel();
  detalleReserva(st, id, `Movida al ${fechaLarga(fecha)}, ${bloque(hora)}.${STUDIO.avisosAutomaticos ? " Le enviamos un correo a la clienta." : " Avísale a la clienta por WhatsApp."}`);
}

// Avisa en vivo cuando entra o cambia una reserva (Supabase Realtime)
function escucharCambios() {
  if (DEMO || escuchando) return;
  escuchando = true;
  sb.channel("reservas-panel").on("postgres_changes", { event: "*", schema: "public", table: "reservas" }, p => {
    if (location.hash !== "#panel") return;
    if (p.eventType === "INSERT") toast("Nueva reserva recibida");
    if (!layer.innerHTML) renderPanel();
  }).subscribe();
}

/* ---------- router y eventos ---------- */
const app = document.getElementById("app"), layer = document.getElementById("layer");
function route() {
  const h = location.hash.slice(1);
  if (h === "panel") { renderPanel(); window.scrollTo(0, 0); }
  else if (!app.querySelector(".hero")) renderPublic().then(() => { const el = h && document.getElementById(h); if (el) el.scrollIntoView(); });
}
window.addEventListener("hashchange", route);

document.addEventListener("click", async e => {
  const t = e.target;
  const res = t.closest("[data-reservar]"); if (res) { e.preventDefault(); return openBooking(res.dataset.reservar); }
  if (t.matches("[data-close]")) return closeBooking();
  const day = t.closest("[data-day]"); if (day) { bk.vals = Object.fromEntries(new FormData(document.getElementById("bk-form"))); bk.fecha = day.dataset.day; bk.hora = null; return drawBooking().then(() => document.querySelector(`[data-day="${bk.fecha}"]`)?.scrollIntoView({ block: "nearest", inline: "center" })); }
  const slot = t.closest("[data-slot]"); if (slot && !slot.disabled) { bk.vals = Object.fromEntries(new FormData(document.getElementById("bk-form"))); bk.hora = +slot.dataset.slot; const y = layer.querySelector(".drawer").scrollTop; await drawBooking(); layer.querySelector(".drawer").scrollTop = y; return; }
  if (t.matches("[data-copy]")) { const txt = document.getElementById("wa-msg").textContent; try { await navigator.clipboard.writeText(txt); toast("Mensaje copiado"); } catch (_) { const r = document.createRange(); r.selectNodeContents(document.getElementById("wa-msg")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Mensaje seleccionado: cópialo con Ctrl+C"); } return; }
  const tb = t.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; filtro.q = ""; confirmDel = null; return renderPanel(); }
  if (t.dataset.estado) { await db.cambiarEstado(t.dataset.id, t.dataset.estado); confirmCancel = null; if (t.closest(".modal")) closeBooking(); toast(t.dataset.estado === "completada" ? "Marcada como completada" : "Hora cancelada, el bloque quedó libre"); return renderPanel(); }
  const sem = t.closest("[data-semana]"); if (sem) { const k = +sem.dataset.semana; semana = k ? addDays(semana, 7 * k) : lunesDe(new Date()); diaMovil = null; return renderPanel(); }
  const dia = t.closest("[data-dia]"); if (dia) { diaMovil = dia.dataset.dia; return renderPanel(); }
  const rs = t.closest("[data-res]"); if (rs && ultimoSt) { confirmCancel = null; return detalleReserva(ultimoSt, rs.dataset.res); }
  if (t.dataset.askcancel) { confirmCancel = t.dataset.askcancel; return detalleReserva(ultimoSt, confirmCancel); }
  if (t.dataset.nocancel) { const id = t.dataset.nocancel; confirmCancel = null; return detalleReserva(ultimoSt, id); }
  if (t.dataset.toggle) { const s = (await db.listarServicios()).find(x => x.id === t.dataset.toggle); await db.actualizarServicio(s.id, { activo: !s.activo }); toast(s.activo ? "Quitado de la web" : "Visible en la web"); return renderPanel(); }
  if (t.dataset.askdel) { confirmDel = t.dataset.askdel; return renderPanel(); }
  if (t.dataset.del) { await db.eliminarServicio(t.dataset.del); confirmDel = null; toast("Servicio eliminado"); return renderPanel(); }
  if (t.id === "logout") { await db.salir(); return renderLogin(); }
  if (t.id === "reset") { await db.reiniciarDemo(); toast("Datos de ejemplo restablecidos"); return renderPanel(); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "bk-svc") { bk.vals = Object.fromEntries(new FormData(document.getElementById("bk-form"))); bk.servicioId = t.value; return drawBooking(); }
  if (t.dataset.price) { const v = Math.max(0, Math.round(+t.value || 0)); await db.actualizarServicio(t.dataset.price, { precio: v }); toast("Precio actualizado a " + clp(v)); }
  if (t.id === "estado") { filtro.estado = t.value; renderPanel(); }
  if (t.dataset.foto && t.files[0]) {
    toast("Subiendo foto…");
    const url = await db.subirFoto(t.files[0]);
    await db.actualizarServicio(t.dataset.foto, { imagen: url, galeria: [url] });
    toast("Foto actualizada"); renderPanel();
  }
  if (t.id === "f-correo" || t.id === "f-telefono") updateLoyal();
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { filtro.q = e.target.value; const pos = e.target.selectionStart; renderPanel().then(() => { const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "bk-form") return submitBooking(e.target);
  if (e.target.id === "move-form") return moverReserva(e.target.dataset.id, document.getElementById("mv-fecha").value, +document.getElementById("mv-hora").value);
  if (e.target.id === "login-form") {
    const v = Object.fromEntries(new FormData(e.target).entries());
    try { await db.entrar(v.email.trim(), v.password); renderPanel(); }
    catch (err) { renderLogin("Correo o contraseña incorrectos."); }
    return;
  }
  if (e.target.id === "new-svc") {
    const v = Object.fromEntries(new FormData(e.target).entries());
    if (!v.nombre.trim() || !(+v.precio > 0)) { document.getElementById("n-err").textContent = "Escribe un nombre y un precio mayor a 0."; return; }
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Guardando…";
    const imagen = v.foto && v.foto.size ? await db.subirFoto(v.foto) : "";
    await db.crearServicio({ nombre: v.nombre.trim(), descripcion: v.descripcion.trim() || "Nuevo servicio del studio.", precio: Math.round(+v.precio), estilo: v.estilo, imagen, galeria: imagen ? [imagen] : [] });
    toast("Servicio agregado"); renderPanel();
  }
});
// arrastrar y soltar bloques del calendario (escritorio)
document.addEventListener("dragstart", e => { const r = e.target.closest?.("[data-res]"); if (!r) return; e.dataTransfer.setData("text/plain", r.dataset.res); e.dataTransfer.effectAllowed = "move"; r.classList.add("dragging"); });
document.addEventListener("dragend", () => document.querySelectorAll(".dragging, .drop-ok").forEach(x => x.classList.remove("dragging", "drop-ok")));
document.addEventListener("dragover", e => { const c = e.target.closest?.("[data-drop]"); if (!c) return; e.preventDefault(); document.querySelectorAll(".drop-ok").forEach(x => x !== c && x.classList.remove("drop-ok")); c.classList.add("drop-ok"); });
document.addEventListener("drop", e => { const c = e.target.closest?.("[data-drop]"); if (!c) return; e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); const [f, h] = c.dataset.drop.split("|"); if (id) moverReserva(id, f, +h); });
window.addEventListener("unhandledrejection", e => { toast("No se pudo completar: " + (e.reason?.message || "revisa tu conexión")); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.innerHTML) closeBooking(); });

if (DEMO) load();
route();
</script>
</body>
